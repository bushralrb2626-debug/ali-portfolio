# Same pattern as ramuza: GitHub repo → Render Web Service.
# This file does not affect ramuza.
services:
  - type: web
    name: ali-portfolio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        # Aiven PostgreSQL Startup (trial $50) — see .env.example. Not SQLite. Not Free-tier.
        sync: false
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: "https://ali-portfolio-web.onrender.com"
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: "12345"
      - key: ADMIN_PASSWORD
        value: "12345"
      - key: CURSOR_BOT_MODEL
        value: "auto"
      - key: SLORSH_API_BASE
        value: "https://ramuza.onrender.com/api/v1"
      # Same bridge secret Slorsh accepts by default — so portfolio bills School Desk without dashboard paste.
      - key: SLORSH_USAGE_SECRET
        value: "slorsh-pf-bridge-v1-ali-brightsteps-9f3c2a"
