# Same pattern as ramuza: GitHub repo → Render Web Service.
# This file does not affect ramuza.
services:
  - type: web
    name: ali-portfolio
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: NPM_CONFIG_PRODUCTION
        value: "false"
      - key: DATABASE_URL
        value: file:/app/prisma/dev.db
      - key: AUTH_TRUST_HOST
        value: "true"
      - key: AUTH_URL
        value: "https://ali-portfolio-web.onrender.com"
      - key: AUTH_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        value: "12345"
      - key: ADMIN_PASSWORD
        value: "12345"
